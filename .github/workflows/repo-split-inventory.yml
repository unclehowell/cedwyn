name: repo-split-inventory
on:
  pull_request:
    paths:
      - 'repo-split-inventory.json'
      - 'tools/repo_split_inventory_check.py'
      - '.github/workflows/repo-split-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'repo-split-inventory.json'
      - 'tools/repo_split_inventory_check.py'
      - '.github/workflows/repo-split-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate the 59-app repository inventory
        run: python3 tools/repo_split_inventory_check.py repo-split-inventory.json
