name: publish-story-image-led
on:
  workflow_dispatch:
  push:
    branches: [main, bpvsbuckler]
    paths:
      - 'static/bpvsbuckler/**'
      - 'themes.json'
      - '.github/workflows/publish-story-image-led.yml'
permissions:
  contents: write
concurrency:
  group: publish-story-image-led
  cancel-in-progress: false
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch the current Story theme branch
        run: |
          git init -q --bare mirror.git
          git -C mirror.git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" +refs/heads/bpvsbuckler:refs/heads/bpvsbuckler
      - name: Build only the Story theme
        env:
          MIRROR: mirror.git
          SECTIONS: story
        run: python3 tools/assemble.py dist
      - name: Rewrite and make the Story output self-contained
        run: |
          python3 tools/rewrite.py dist
          python3 tools/selfcontain.py dist --fix
          python3 tools/selfcontain.py dist
      - name: Publish the Story folder without touching other themes
        env:
          TOKEN: ${{ github.token }}
        run: |
          U="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 -b site "${U}" pub
          cd pub
          git config user.name "cedwyn-bot"
          git config user.email "cedwyn-bot@users.noreply.github.com"
          # The full-site publisher can update site while this theme builds.
          # Rebase the story-only output on the newest site head before each push.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin site
            git reset --hard origin/site
            rsync -a --delete ../dist/story/ story/
            for d in _blob _ext; do
              if [ -d "../dist/${d}" ]; then
                mkdir -p "${d}"
                rsync -a "../dist/${d}/" "${d}/"
              fi
            done
            git add story _blob _ext
            if git diff --cached --quiet; then
              echo "Story output is already current on site."
              exit 0
            fi
            git commit -m "Publish image-led Story theme — Sion's Tab agent"
            if git push "${U}" HEAD:site; then
              echo "Story-only output published on attempt ${attempt}."
              exit 0
            fi
            echo "site advanced during publish attempt ${attempt}; refreshing and retrying."
            sleep 2
          done
          echo "Could not publish after five refresh-and-push attempts."
          exit 1
