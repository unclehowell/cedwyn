name: evidence-hierarchy-ci
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'data/artifact-assessments.json'
      - 'data/observations.json'
      - 'data/site-areas.json'
      - 'data/spatial/**'
      - 'web/_cedwyn/**'
      - '.github/workflows/evidence-hierarchy-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Python syntax
        run: |
          python -m py_compile tools/build_db.py tools/db_export.py tools/section_dbs.py tools/evidence_observations.py tools/site_consolidations.py tools/test_evidence_hierarchy.py tools/test_parcel_stories.py tools/test_landing_map_views.py tools/site.py tools/agent_lint.py
      - name: JavaScript syntax
        run: |
          node --check web/_cedwyn/cat.js
          node --check web/_cedwyn/evidence-browser.js
          node --check web/_cedwyn/agent-tools.js
          node --check web/_cedwyn/parcel-panel.js
          node --check web/_cedwyn/parcel-modal.js
          node --check web/_cedwyn/landing-map-views.js
          node --check web/_cedwyn/ghf/basecamp.js
      - name: Structured data validity
        run: |
          python -m json.tool data/artifact-assessments.json > /dev/null
          python -m json.tool data/observations.json > /dev/null
          python -m json.tool data/site-areas.json > /dev/null
          python -m json.tool data/parcel-stories.json > /dev/null
          python -m json.tool data/spatial/cedwyn.json > /dev/null
      - name: Section database and hierarchy tests
        run: |
          python tools/test_evidence_hierarchy.py
          python tools/test_parcel_stories.py
          python tools/test_landing_map_views.py
