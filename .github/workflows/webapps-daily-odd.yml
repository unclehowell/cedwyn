name: webapps-daily-odd
# Daily webapp refresh, GitHub half: the odd live "N of 59" slots (owner ask, 11 Nov 2026). The even slots are checked by the
# Cloudflare Worker ghf-status cron at 04:35 UTC; this job runs after it, adds the even verdict, asks a one-app sync for each
# changed app and dispatches ONE build-cedwyn only when something changed since the live build and none is running.
# Lists: .github/daily-refresh/apps.json. Never edits app content, never merges, never force-pushes. — Sion's Tab agent
on:
  schedule:
    - cron: '25 5 * * *'   # 05:25 UTC daily (after the Worker's 04:35 check; before the 06:20 evidence resync)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and report only; ask no sync and dispatch no build'
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
concurrency:
  group: webapps-daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Script and lists from this commit (no checkout of the site repo)
        run: |
          mkdir -p dr
          for f in odd.py apps.json; do curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/daily-refresh/$f" -o dr/$f; done
      - name: Check odd apps, read the even verdict, sync changed apps, one build if needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python3 dr/odd.py
