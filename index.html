<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>Cedwyn Estate</title>
<meta name="description" content="Select Wales, Britain or Patagonia, Argentina.">
<style>
:root{color-scheme:dark;background:#0b1118;color:#f4f7fa;font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100svh;min-height:100dvh;background:#0b1118;overflow:hidden}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cover{width:100%;height:100svh;height:100dvh;padding:clamp(7px,1.5vw,18px)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:clamp(7px,1.4vw,17px);width:100%;height:100%}
.place{position:relative;display:flex;align-items:flex-end;justify-content:center;min-width:0;min-height:0;overflow:hidden;border:0;border-radius:clamp(11px,1.5vw,20px);padding:0;background:#111922;color:#fff;cursor:pointer;isolation:isolate;-webkit-tap-highlight-color:transparent}
.place:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.04) 28%,rgba(0,0,0,.18) 54%,rgba(0,0,0,.8) 100%)}
.place img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.place:hover img,.place:focus-visible img{transform:scale(1.025)}
.place span{display:block;max-width:100%;padding:clamp(15px,3.5vw,42px);font-size:clamp(23px,4.25vw,54px);font-weight:600;line-height:1.08;letter-spacing:.015em;text-align:center;text-wrap:balance;text-shadow:0 2px 20px #000}
dialog{width:min(1160px,calc(100vw - 18px));max-width:1160px;max-height:calc(100dvh - 18px);margin:auto;padding:0;overflow:hidden;border:1px solid rgba(219,229,240,.25);border-radius:17px;background:#0c1219;color:#f4f6f8;box-shadow:0 24px 90px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(2,5,9,.84);backdrop-filter:blur(5px)}
.modal-inner{display:flex;flex-direction:column;min-height:0;max-height:calc(100dvh - 20px)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.12);background:#0d141c}
.modal-head h2{margin:0;color:#f5f7fa;font-size:clamp(20px,3.7vw,30px);font-weight:600;line-height:1.2;letter-spacing:.01em}
.close{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:#18212a;color:white;font:300 30px/1 system-ui,sans-serif;cursor:pointer}
.modal-content{overflow:auto;overscroll-behavior:contain;padding:16px clamp(12px,2vw,22px) 24px}
.app-section{margin:0 0 23px}
.app-section h3{margin:0 0 10px;color:#aebdca;font-size:12px;font-weight:650;letter-spacing:.13em;text-transform:uppercase}
.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.app-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:11px;background:#121a23;color:#f3f5f7;text-decoration:none;transition:transform .15s ease,border-color .15s ease,background .15s ease}
a.app-card:hover,a.app-card:focus-visible{transform:translateY(-2px);border-color:rgba(185,215,238,.7);background:#192531}
.app-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#111820}
.app-label{display:block;padding:9px 10px 10px;font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.app-card.soon{cursor:default;border-style:dashed;border-color:rgba(185,215,238,.35)}
.app-card.soon small{display:block;margin-top:4px;color:#aebdca;font-size:11px;font-weight:500;letter-spacing:.04em}
@media(max-width:780px){.app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:540px){
 .cover{padding:7px}.choices{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:7px}
 .place{border-radius:11px}.place span{font-size:clamp(23px,7.2vw,35px);padding:18px}
 dialog{width:calc(100vw - 10px);max-height:calc(100dvh - 10px);border-radius:13px}
 .modal-inner{max-height:calc(100dvh - 12px)}.modal-head{padding:11px 12px}.close{flex-basis:38px;width:38px;height:38px}
 .modal-content{padding:12px 9px 18px}.app-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .app-label{padding:8px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){.place img,.app-card{transition:none}}
</style>
</head>
<body>
<main class="cover">
  <div class="choices" aria-label="Choose a place">
    <button class="place" type="button" data-place="wales" aria-haspopup="dialog">
      <img src="/_cedwyn/halves/img/tile-wales.webp?v=3" alt="" fetchpriority="high">
      <span>Wales, Britain</span>
    </button>
    <button class="place" type="button" data-place="patagonia" aria-haspopup="dialog">
      <img src="/_cedwyn/halves/img/tile-patagonia.webp?v=3" alt="" fetchpriority="high">
      <span>Patagonia, Argentina</span>
    </button>
  </div>
</main>
<dialog id="place-dialog" aria-labelledby="modal-title">
 <div class="modal-inner">
  <div class="modal-head"><h2 id="modal-title">Wales, Britain</h2><button class="close" type="button" aria-label="Close">×</button></div>
  <div class="modal-content" id="modal-content"></div>
 </div>
</dialog>
<script>
(function(){
'use strict';
var imgBase='/_cedwyn/halves/img/';
var groups=[
 {title:'Interactive',items:[
  ['infographic','Title chain · infographic','ty-mawr-1974-reconstruction'],
  ['chess','The Chessboard','wales-ar-forest'],
  ['csscpsg','The Grammar House (CSSCPSGP)','ghf2-drawing-room'],
  ['courtdrills','Court Drills · Procedural Unfairness','ghf2-museum'],
  ['app','The Case Office','wales-ar-green'],
  ['chat','Ask the Archive','wales-stop-brynwell'],
  ['dartboard','The Disclosure Dartboard','wales-ar-villa'],
  ['estate','Cedwyn Estate','tile-wales'],
  ['directory','Cedwyn Pages','tile-patagonia'],
  ['terrain','3D map','wales-ar-villa'],
  ['cyberspace','The Digital Estate','network-datacentre'],
  ['nft-art','The Garden Gallery','ghf2-museum']
 ]},
 {title:'Research',items:[
  ['fcg','FCG · Security Clearance','wales-ar-forest'],
  ['accounts','The Counting House','ghf2-bedroom'],
  ['authorities','Public Authorities','wales-ar-forest'],
  ['wdtk','FOI Requests (WhatDoTheyKnow)','ghf2-drawing-room'],
  ['review','Independent Review','ty-mawr-1974-reconstruction'],
  ['research','The Research Library','wales-ar-villa'],
  ['meeting','The Council Chamber','ghf2-drawing-room'],
  ['projects','The Project Office','ghf2-exterior'],
  ['watchtower','Watchtower','wales-ar-forest'],
  ['fb2','farmbook 2 · Today','ghf2-museum'],
  ['email','The Post Office','ghf2-drawing-room'],
  ['emails','The Post Office · Calendar','ghf2-bedroom'],
  ['kissed-frogs','Kissed Frogs','ghf2-wedding'],
  ['whattheydontsay',"What They Don't Say",'wales-ar-villa'],
  ['blog','Blog','ghf2-drawing-room']
 ]},
 {title:'Historic artifacts',items:[
  ['wiki','Legal Wiki','ghf2-drawing-room'],
  ['records','Primary Records','ty-mawr-1974-reconstruction'],
  ['docs','Evidence Catalogue','wales-ar-forest'],
  ['wayback','The Wayback Vault','wales-stop-brynwell'],
  ['nomenclature','Nomenclature','wales-ar-green'],
  ['maps','The Map Room','wales-ar-villa'],
  ['fb','The Farm Album','ghf2-museum']
 ]},
 {title:'Story',items:[
  ['ebooks','The E-book Shelf','ghf2-bedroom'],
  ['story','Full story · BP vs Buckler','ty-mawr-1974-reconstruction'],
  ['thousand-cuts','1000 Cuts','ghf2-exterior'],
  ['oldbill','Old Bill · Who Gained, Who Lost','ghf2-exterior'],
  ['qa','The Q&A Hall','wales-stop-brynwell'],
  ['shop','Gift Shop & Marketplace','ghf2-drawing-room'],
  ['documentary','Cedwyn · documentary','wales-hologram'],
  ['familytree','The family tree','wales-ar-forest']
 ]}
];
var places={
 wales:{title:'Wales, Britain',specific:[
  ['Virtual reconstruction · AR glasses','/wales/','wales-ar-green']
 ]},
 patagonia:{title:'Patagonia, Argentina',specific:[
  ['Great House II · physical reconstruction','/argentina/#house','ghf2-exterior'],
  ['Wedding venue','/argentina/#book','ghf2-wedding'],
  ['B&B · guest rooms','/argentina/#book','ghf2-bedroom'],
  ['Stables','/argentina/#house','ghf2-stables'],
  ['Barn and cottage','/argentina/#house','ghf2-barn'],
  ['Museum','/argentina/#museum','ghf2-museum']
 ]}
};
var dialog=document.getElementById('place-dialog'),title=document.getElementById('modal-title'),content=document.getElementById('modal-content'),close=dialog.querySelector('.close'),opener=null;
function photo(key){var suffix=key==='network-datacentre'?'.svg':'.webp';var v=key==='network-datacentre'?'v=1':'v=3';return imgBase+key+suffix+'?'+v}
function card(label,href,image){return '<a class="app-card" href="'+href+'"><img src="'+photo(image)+'" alt="" loading="lazy" decoding="async"><span class="app-label">'+label+'</span></a>'}
function openPlace(id,button){
 var place=places[id];if(!place)return;opener=button;title.textContent=place.title;
 var html='<section class="app-section"><h3>For this place</h3><div class="app-grid">';
 place.specific.forEach(function(item){html+=card(item[0],item[1],item[2])});
 html+='</div></section>';
 groups.forEach(function(group){html+='<section class="app-section"><h3>'+group.title+'</h3><div class="app-grid">';
 var route=id==='patagonia'?'argentina':'wales';group.items.forEach(function(item){html+=card(item[1],'/'+route+'/'+item[0]+'/',item[2])});
 html+='</div></section>'});
 html+='<section class="app-section"><h3>Coming soon</h3><div class="app-grid"><div class="app-card soon" aria-label="Network, coming soon"><img src="'+photo('network-datacentre')+'" alt="" loading="lazy"><span class="app-label">Network<small>Coming soon</small></span></div></div></section>';
 content.innerHTML=html;
 if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');
 close.focus();
}
document.querySelectorAll('[data-place]').forEach(function(button){button.addEventListener('click',function(){openPlace(button.getAttribute('data-place'),button)})});
close.addEventListener('click',function(){if(typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open')});
dialog.addEventListener('click',function(e){if(e.target===dialog){if(typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open')}});
dialog.addEventListener('close',function(){if(opener)opener.focus()});
})();
</script>
</body>
</html>
