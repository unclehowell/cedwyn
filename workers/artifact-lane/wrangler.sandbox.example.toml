# Example configuration only. Never use this file as a production deployment config.
name = "cedwyn-artifact-lane-sandbox"
main = "src/index.mjs"
compatibility_date = "2026-10-31"
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "cedwyn-artifacts-sandbox"

[[d1_databases]]
binding = "DB"
database_name = "cedwyn-artifacts-sandbox"
database_id = "REPLACE_WITH_SANDBOX_DATABASE_ID"
