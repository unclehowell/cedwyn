<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive · Cedwyn</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#14141c;color:#e8e8f0}
a{color:#9cf}header.cw{padding:14px 16px;border-bottom:2px solid #fca;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.cw a.home{color:#fca;font-weight:700;text-decoration:none;font-size:18px}header.cw nav a{color:#cfcfe0;margin-right:12px;font-size:14px}
main{max-width:60rem;margin:0 auto;padding:16px}input,textarea,select,button{font:inherit;border-radius:8px;border:1px solid #444;background:#1d1d28;color:#e8e8f0;padding:8px 10px}
button{background:#fca;color:#14141c;border-color:#fca;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#1d1d28;padding:10px;border-radius:8px;font-size:13px}
.muted{color:#9a9ab0;font-size:14px}.card{background:#1d1d28;border:1px solid #2c2c3a;border-radius:10px;padding:10px 12px;margin:8px 0}
.card h3{margin:0 0 4px;font-size:16px}.snip{font-size:14px;color:#cfcfe0}img.prev{max-width:100%;max-height:320px;border-radius:6px;display:block;margin:6px 0}</style><script src="/_cedwyn/ghf/ghf-boot.js?v=2.1.4c"></script></head><body><header class="cw"><a class="home" href="/">Cedwyn</a><nav><a href="/">Themes</a><a href="/catalogue/">Catalogue</a><a href="/graphql/">GraphQL</a><a href="/wayback/">Archive</a></nav></header><main><h1>Leaving the archive?</h1><div id="box" class="card"><p class="muted">Checking the archive…</p></div><p class="muted">Cedwyn keeps visitors inside the archive. Pages we have captured open here as dated copies; anything else is recorded below as text.</p></main><script src="/_cedwyn/cat.js"></script><script>
var u=new URLSearchParams(location.search).get('u')||'',box=document.getElementById('box');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
fetch('/wayback/go/captures.json').then(function(r){return r.json();}).then(function(c){var k=Cedwyn.normkey(u),hit=c[k];
if(hit){box.innerHTML='<h3>'+esc(hit.t||k)+'</h3><p class="muted">Captured '+esc((hit.c||'').slice(0,10))+'. Opening the archived copy…</p><p><a href="'+esc(hit.l)+'">Open the archived copy</a></p>';setTimeout(function(){location.replace(hit.l);},900);return;}
var host='';try{host=new URL(u).hostname;}catch(e){}
box.innerHTML='<h3>Not yet archived</h3><p>The original address is recorded here as text:</p><pre>'+esc(u)+'</pre>'+(host?'<p><a href="/catalogue/?q='+encodeURIComponent('"'+host.replace(/^www\./,'').split('.')[0]+'"')+'">Search the catalogue for '+esc(host)+'</a> · <a href="/wayback/">Browse the Wayback Vault</a></p>':'');
}).catch(function(){box.innerHTML='<h3>Not yet archived</h3><pre>'+esc(u)+'</pre>';});
</script></body></html>
