<script type="module">
// Wayback document viewer: renders a same-origin PDF page by page (pdf.js, Apache-2.0, served from /viewer/pdfjs/). — Cedwyn editors
import * as pdfjsLib from '/viewer/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/viewer/pdfjs/pdf.worker.min.mjs';
const msg = document.getElementById('msg'), box = document.getElementById('pages');
const q = new URLSearchParams(location.search).get('file') || '';
let u; try { u = new URL(q, location.href); } catch (e) {}
if (!u || u.origin !== location.origin || !/\.pdf$/i.test(u.pathname)) { msg.textContent = 'No document.'; }
else {
  const fallback = () => { msg.innerHTML = 'This document could not be shown here. <a href="' + u.href + '">Open the PDF</a>.'; };
  pdfjsLib.getDocument({ url: u.href, standardFontDataUrl: '/viewer/pdfjs/standard_fonts/' }).promise.then(async (pdf) => {
    msg.textContent = pdf.numPages + (pdf.numPages === 1 ? ' page' : ' pages');
    const W = () => Math.min(box.clientWidth - 12, 1000);
    const io = new IntersectionObserver((ents) => { for (const e of ents) if (e.isIntersecting) { io.unobserve(e.target); draw(e.target); } }, { rootMargin: '600px 0px' });
    async function draw(c) {
      const page = await pdf.getPage(+c.dataset.n);
      const v1 = page.getViewport({ scale: 1 }), scale = W() / v1.width, dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: scale * dpr });
      c.width = vp.width; c.height = vp.height; c.style.width = (vp.width / dpr) + 'px';
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
    const first = await pdf.getPage(1), r = first.getViewport({ scale: 1 });
    for (let n = 1; n <= pdf.numPages; n++) {
      const c = document.createElement('canvas'); c.dataset.n = n; c.setAttribute('aria-label', 'Page ' + n);
      c.width = 10; c.height = Math.round(10 * r.height / r.width); c.style.width = W() + 'px';
      box.appendChild(c); io.observe(c);
    }
  }).catch(fallback);
}
