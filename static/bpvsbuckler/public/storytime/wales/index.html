<body class="v-wales"><main class="st" id="storytime"><p class="st-kick">Cedwyn Estate, Wales · Storytime tour</p><p>Loading the story…</p><noscript><section><h2>Beneath the ground</h2><p><i>before 1824</i></p><p>Long before any estate paper, Llandough was lived on: a Roman villa, an early Christian cemetery of over a thousand burials beside the church, and finds later lost in a 1983 fire.</p><p>EV-0055 · EV-0056 · EV-0054 · EV-0206 · EV-0018 · EV-0068 · EV-0293 · EV-0126 · EV-0134</p></section><section><h2>The name Cedwyn</h2><p><i>1392 to 1902</i></p><p>The name Cedwyn runs through the land: Cwm-Cedwyn on the Ely, Nant-Cedwyn, Cwm Cydfin Wood. Our reading: the name is older than the estate papers.</p><p>EV-0001 · EV-0195 · EV-0198 · EV-0200 · EV-0210 · EV-0219 · EV-0218</p></section><section><h2>Tŷ Mawr on the map</h2><p><i>1824</i></p><p>1824: a survey draws the holding as plan 19, Cedfin or Tŷ Mawr Farm, with a table of its fields. The first mention found so far in the estate surveys.</p><p>EV-0004 · EV-0211</p></section><section><h2>The tithe map</h2><p><i>about 1841</i></p><p>About 1841: the tithe list puts John Williams on 36 parcels, 33 entered against Bute. A tithe list did not test title; our reading is that this Bute entry is the one to scrutinise.</p><p>EV-0215 · EV-0005</p></section><section><h2>Rates and the quarry</h2><p><i>1872 to 1877</i></p><p>1872 to 1877: rate books name John Williams; an 1877 Bute agreement with a quarry firm touches the house parcel. Our reading: the start of the limeworks carve-up.</p><p>EV-0212 · EV-0006 · EV-0007 · EV-0008</p></section><section><h2>A household of standing</h2><p><i>1881 to 1910</i></p><p>1881 to 1910: John Williams, farmer, in the census; on the court leet grand jury in 1910. Our reading: a family of standing in the parish.</p><p>EV-0224 · EV-0010 · EV-0011 · EV-0012 · EV-0283</p></section><section><h2>Woods, drains and estate papers</h2><p><i>1902 to 1931</i></p><p>1902 to 1931: estate auctions, conveyances and a 1916 estate paper the family contest. Meanwhile the family plant trees, the native custom of asserting ownership.</p><p>EV-0219 · EV-0013 · EV-0014 · EV-0015 · EV-0016 · EV-0009 · EV-0199</p></section><section><h2>Transferred over their heads</h2><p><i>1938 to 1942</i></p><p>1938 to 1942: the Bute interest passes to Western Ground Rents; a 1939 paper is drawn up in John Williams&#x27;s name. Our reading: the land changed hands on paper without the family.</p><p>EV-0022 · EV-0019 · EV-0020 · EV-0216 · EV-0023 · EV-0220 · EV-0024</p></section><section><h2>The courts begin</h2><p><i>1949 to 1957</i></p><p>1949 to 1957: an unwritten re-grant, title papers missing from the farmhouse, then the county court. Our reading: occupation recast as permission.</p><p>EV-0025 · EV-0026 · EV-0027 · EV-0029 · EV-0030 · EV-0031 · EV-0032 · EV-0034</p></section><section><h2>A Welsh Crichel Down</h2><p><i>1958</i></p><p>1958: Mrs Mary Buckler of Tŷ Mawr calls it a Welsh Crichel Down: land farmed by her family since 1667, wrongfully appropriated.</p><p>EV-0035 · EV-0036 · EV-0037 · EV-0038</p></section><section><h2>Orders, a school and a green</h2><p><i>1959 to 1970</i></p><p>1959 to 1970: offers, a 1962 order, the school site in 1965, BP in 1969, and parcel C registered as village green in 1970. Our reading: taken a parcel at a time.</p><p>EV-0039 · EV-0040 · EV-0041 · EV-0042 · EV-0043 · EV-0044</p></section><section><h2>The survey and the open day</h2><p><i>1971 to 1975</i></p><p>1974: the Royal Commission measures the house; an open day to save it; Mary Williams pleads ownership. 1975: the house moves between BP companies on paper.</p><p>EV-0045 · EV-0046 · EV-0630 · EV-0631 · EV-0047 · EV-0048 · EV-0049 · EV-0050 · EV-0051 · EV-0052</p></section><section><h2>Registered</h2><p><i>1980 to 1985</i></p><p>1982 to 1983: the land, then the farmhouse, first registered as titles WA231076 and WA240304. Our reading: the registration step in the pattern.</p><p>EV-0057 · EV-0058 · EV-0059 · EV-0066 · EV-0063 · EV-0065 · EV-0069 · EV-0070 · EV-0071 · EV-0067 · EV-0061 · EV-0072</p></section><section><h2>Judgment</h2><p><i>1986 to 1987</i></p><p>1986 to 1987: High Court, then Court of Appeal, for BP. The local plan still marked the buildings to be retained.</p><p>EV-0073 · EV-0074 · EV-0075 · EV-0077 · EV-0078 · EV-0079 · EV-0080 · EV-0076 · EV-0214 · EV-0632</p></section><section><h2>The house comes down</h2><p><i>1988</i></p><p>1988: eviction, then on 7 December bulldozers just after 4 am. By breakfast nothing stood, while listing was still being considered.</p><p>EV-0086 · EV-0088 · EV-0089 · EV-0090 · EV-0092 · EV-0093 · EV-0094 · EV-0095 · EV-0096 · EV-0098 · EV-0099 · EV-0103 · EV-0104 · EV-0105 · EV-0106 · EV-0107 · EV-0084 · EV-0629 · EV-0083</p></section><section><h2>After</h2><p><i>1989 to 1996</i></p><p>1989 to 1996: building destroyed by owners, the record notes. Houses and a green follow; the 1994 dig finds the early Christian cemetery.</p><p>EV-0108 · EV-0112 · EV-0117 · EV-0118 · EV-0119 · EV-0122 · EV-0113 · EV-0124 · EV-0126 · EV-0127 · EV-0129 · EV-0131 · EV-0133 · EV-0135 · EV-0134 · EV-0136</p></section><section><h2>In the law books</h2><p><i>2002 to 2017</i></p><p>2002 onward: the case becomes a textbook lesson on adverse possession while the land passes on.</p><p>EV-0637 · EV-0633 · EV-0638 · EV-0644 · EV-0641 · EV-0639 · EV-0636 · EV-0217 · EV-0139</p></section><section><h2>Asking the record holders</h2><p><i>2026</i></p><p>2026: the record holders are asked directly. Every answer becomes a catalogue entry; every gap a missing record.</p><p>EV-0146 · EV-0147 · EV-0148 · EV-0156 · EV-0158 · EV-0161 · EV-0170 · EV-0167 · EV-0178 · EV-0184 · EV-0188 · EV-0190</p></section></noscript></main>
