<body class="v-museum"><main class="st" id="storytime"><p class="st-kick">Cedwyn Estate · Storytime · The museum</p><p>Loading the story…</p><noscript><section><h2>Beneath the ground</h2><p><i>before 1824</i></p><p>Long before any estate paper names the farm, the ground at Llandough was lived on. A 1980 newspaper report describes the substantial remains of a Roman villa at Llandough. A 1931 letter records a spearhead, a spur and the skeletons of six big men found at the church farm about 1858. The 1994 excavation beside St Dochdwy&#x27;s church recorded more than a thousand burials. In 1983 a warehouse fire destroyed the finds from the villa site. Our reading: this was a place of standing for many centuries before the paper record begins.</p><p>EV-0055 · EV-0056 · EV-0054 · EV-0206 · EV-0018 · EV-0068 · EV-0293 · EV-0126 · EV-0134</p></section><section><h2>The name Cedwyn</h2><p><i>1392 to 1902</i></p><p>The estate&#x27;s name runs through the landscape. Research notes gather Cwm-Cedwyn, the wooded dell on the Ely, Nant-Cedwyn, the brook, and Ynys-Cedwyn. A 1392 reference to Cwm-Cedwyn in Llandough boundary records is noted, with the original not yet held. In 1902 a sale catalogue lists Cwm Cydfin Wood in Leckwith and Llandough, and the same name survives today in the Cwm Cydfin nature site. Our reading: the name Cedwyn is older than the estate papers that later describe the land.</p><p>EV-0001 · EV-0195 · EV-0198 · EV-0200 · EV-0210 · EV-0219 · EV-0218</p></section><section><h2>Tŷ Mawr on the map</h2><p><i>1824</i></p><p>In 1824 a survey of the district draws the holding as plan 19: Cedfin, or Tŷ Mawr Farm, with a table of its fields. An 1824 map of Tŷ Mawr survives as an image. This is the first mention found so far in the estate surveys. Our reading: the survey records a house and lands already established, not something new.</p><p>EV-0004 · EV-0211</p></section><section><h2>The tithe map</h2><p><i>about 1841</i></p><p>Around 1841 the tithe apportionment for Llandough, Cogan and Leckwith lists John Williams as occupier of thirty-six parcels: thirty-three entered against the Marquess of Bute, three against the church glebe. A tithe apportionment was a list for a church charge; it did not test who held title. Our reading: these entries are the earliest paper statement of Bute ownership here, and they are the statement the project scrutinises.</p><p>EV-0215 · EV-0005</p></section><section><h2>Rates and the quarry</h2><p><i>1872 to 1877</i></p><p>Parish rate books from 1872 to 1876 name John Williams at the farm; the identification is still provisional. In 1877 an agreement between Bute and Daniel Thomas and Son touches the house parcel, either a sale or a quarry lease; the original is not yet located. A paper of 6 November 1877 in John Williams&#x27;s name is reported on later files, its original also unlocated. Our reading, under the project&#x27;s working paradigm: the quarry is where the carving of the estate begins, the line that leads to the limeworks acres. The catalogue does not yet hold the acreage.</p><p>EV-0212 · EV-0006 · EV-0007 · EV-0008</p></section><section><h2>A household of standing</h2><p><i>1881 to 1910</i></p><p>The 1881 census finds John Williams, farmer, and his household. In 1891 a newspaper reports three geese taken from Mr John Williams of Great House Farm. In 1897 the Marconi wireless trials run from Lavernock Point nearby. In 1900 the late Marquess&#x27;s will passes his estates in Leckwith with Llandough to a younger son. In 1910 John Williams sits on the grand jury of the court leet at Llandough, which records no encroachments to present. Our reading: the Williams appear in the record as a family of standing in the parish.</p><p>EV-0224 · EV-0010 · EV-0011 · EV-0012 · EV-0283</p></section><section><h2>Woods, drains and estate papers</h2><p><i>1902 to 1931</i></p><p>In 1902 Bute&#x27;s coppice woods, Cwm Cydfin Wood among them, go to auction. A Bute conveyance of 1905 is cited on a later registration file. In February 1916 a Bute estate tenancy document with a plan refers to the whole of the farm: it is the estate&#x27;s own paper, and exactly what is contested. A drain agreement follows in 1924, and quarrying ends by 1928. Across these years the family keep planting trees on the land, the native custom of asserting ownership, recorded in a family photograph.</p><p>EV-0219 · EV-0013 · EV-0014 · EV-0015 · EV-0016 · EV-0009 · EV-0199</p></section><section><h2>Transferred over their heads</h2><p><i>1938 to 1942</i></p><p>In December 1938 the Bute interest in Cardiff ground rents passes to Western Ground Rents. A conveyance of the reversion carries a plan, and a 1965 contract later names a conveyance of 25 December 1938 as the root of title. In May 1939 Western Ground Rents draws up an agreement in John Williams&#x27;s name, with a plan. From 1940 the company gives about 109 acres of Leckwith Woods to Cardiff council. Testimony, not yet in the catalogue, places wartime smoke-screen vehicles on parcel B from 1939. Our reading: the family&#x27;s ground changed hands on paper without them.</p><p>EV-0022 · EV-0019 · EV-0020 · EV-0216 · EV-0023 · EV-0220 · EV-0024</p></section><section><h2>The courts begin</h2><p><i>1949 to 1957</i></p><p>In 1949 an unwritten surrender and re-grant is recorded against Frederick Buckler; no written record of it is held. Around 1950 the family&#x27;s title papers go missing from the blanket box in the farmhouse. Bute manor disposals run from 1950 to 1957. County court registers open in 1953, a further attempt follows in 1954, and a possession order of 1955 is still to be located. Our reading: each step frames the family&#x27;s long occupation as permission, the twelve-year pattern the project traces.</p><p>EV-0025 · EV-0026 · EV-0027 · EV-0029 · EV-0030 · EV-0031 · EV-0032 · EV-0034</p></section><section><h2>A Welsh Crichel Down</h2><p><i>1958</i></p><p>In May 1958, at the Leckwith Common inquiry, Mrs Mary Doreen Buckler of Great House Farm objects to anything beyond playing fields. In November the Western Mail reports her objection to industrial development near her farm, Tŷ Mawr, and records that land farmed by her family since 1667 had been wrongfully appropriated. She calls it a Crichel Down, after the 1954 national scandal over land taken for public use and not offered back to its owners. Our reading: she named the pattern the project now traces.</p><p>EV-0035 · EV-0036 · EV-0037 · EV-0038</p></section><section><h2>Orders, a school and a green</h2><p><i>1959 to 1970</i></p><p>In 1959 and 1965 Western Ground Rents sends offers concerning the house and garden. A 1961 deed with a plan involves a brick and tile company and Cardiff City. A possession order of December 1962 is recorded but not yet held. In June 1965 three and a third acres go to the county council for the Llandough school. In 1969 a conveyance passes land to the BP Pension Trust, and in June 1970 parcel C is registered as village green VG41. Our reading: the estate is taken a parcel at a time.</p><p>EV-0039 · EV-0040 · EV-0041 · EV-0042 · EV-0043 · EV-0044</p></section><section><h2>The survey and the open day</h2><p><i>1971 to 1975</i></p><p>On 26 April 1974 an architect of the Royal Commission measures and draws the house. That April the Daily Telegraph reports an open day to save the ancient Welsh house, quoting the family: four hundred years at Tŷ Mawr. In July Mary Williams pleads ownership in the county court action. A letter writer calls the threatened demolition a grievous loss. In May 1975 the farmhouse and garden pass between two BP companies on paper. Our reading: the house was recognised as historic while its title was moved around it.</p><p>EV-0045 · EV-0046 · EV-0630 · EV-0631 · EV-0047 · EV-0048 · EV-0049 · EV-0050 · EV-0051 · EV-0052</p></section><section><h2>Registered</h2><p><i>1980 to 1985</i></p><p>In 1980 a Member of Parliament calls Western Ground Rents the most rapacious ground landlord, now owned by the BP pension fund. In 1982 the archaeological trust warns of the site&#x27;s sensitivity. In 1982, and then in February 1983, the land and the farmhouse are first registered, as titles WA231076 and WA240304. Mary Doreen Williams dies in March 1983. Our reading: first registration, months after the warning and weeks before her death, is the clandestine registration step in the pattern the project traces.</p><p>EV-0057 · EV-0058 · EV-0059 · EV-0066 · EV-0063 · EV-0065 · EV-0069 · EV-0070 · EV-0071 · EV-0067 · EV-0061 · EV-0072</p></section><section><h2>Judgment</h2><p><i>1986 to 1987</i></p><p>In July 1986 the High Court at Cardiff gives judgment for BP. In February 1987 the East Vale local plan marks the buildings on the site to be retained, and the two titles are joined. On 31 July 1987 the Court of Appeal decides BP Properties against Buckler, and a petition to the House of Lords follows. Our reading: the judgment turned on paper title and on letters, never on how the family came to the land.</p><p>EV-0073 · EV-0074 · EV-0075 · EV-0077 · EV-0078 · EV-0079 · EV-0080 · EV-0076 · EV-0214 · EV-0632</p></section><section><h2>The house comes down</h2><p><i>1988</i></p><p>In April 1988 police wait outside the farmhouse. In July BP&#x27;s Welsh sales are reported, and Cadw photographs the farmhouse and the barn. At the end of November entry is forced and an outbuilding roof is taken off. In early December Cadw is reported to be considering listing the house. On 7 December a team with bulldozers moves in just after four in the morning; by breakfast no building is left standing. Our reading: the house came down while its listing was still under consideration.</p><p>EV-0086 · EV-0088 · EV-0089 · EV-0090 · EV-0092 · EV-0093 · EV-0094 · EV-0095 · EV-0096 · EV-0098 · EV-0099 · EV-0103 · EV-0104 · EV-0105 · EV-0106 · EV-0107 · EV-0084 · EV-0629 · EV-0083</p></section><section><h2>After</h2><p><i>1989 to 1996</i></p><p>In 1989 the monuments record notes the building destroyed by its owners, and Vale councillors authorise legal action against BP Properties over the demolition. The family&#x27;s application to the European Commission of Human Rights, lodged in May 1988, is decided. Outline planning permission for housing follows, then twenty detached houses in 1992, with a village green planting plan. In 1994 the excavation north of the church records the early Christian cemetery. Our reading: the record kept growing after the house was gone.</p><p>EV-0108 · EV-0112 · EV-0117 · EV-0118 · EV-0119 · EV-0122 · EV-0113 · EV-0124 · EV-0126 · EV-0127 · EV-0129 · EV-0131 · EV-0133 · EV-0135 · EV-0134 · EV-0136</p></section><section><h2>In the law books</h2><p><i>2002 to 2017</i></p><p>The 1987 judgment enters the land-law textbooks as a leading case on adverse possession, taught and cited as far as Hong Kong. Meanwhile parts of the land pass on: woodland to the Forest of Cardiff, then a transfer to a house builder. Our reading: the case became a lesson about permission while the questions about title stayed unasked.</p><p>EV-0637 · EV-0633 · EV-0638 · EV-0644 · EV-0641 · EV-0639 · EV-0636 · EV-0217 · EV-0139</p></section><section><h2>Asking the record holders</h2><p><i>2026</i></p><p>In 2026 the project asks the record holders directly. The Land Registry explains the registration history and lists the first-registration documents. Cadw releases its 1988 survey photographs. The national manorial register, the Royal Commission, Glamorgan Archives and the national museum answer what they hold. Every answer becomes a catalogue entry, and every gap becomes a missing record. Our reading: the chronology is still being written, one disclosure at a time.</p><p>EV-0146 · EV-0147 · EV-0148 · EV-0156 · EV-0158 · EV-0161 · EV-0170 · EV-0167 · EV-0178 · EV-0184 · EV-0188 · EV-0190</p></section></noscript></main>
