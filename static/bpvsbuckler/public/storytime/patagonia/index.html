<body class="v-patagonia"><main class="st" id="storytime"><p class="st-kick">Great House Farm II · Storytime walk-round</p><p>Loading the story…</p><noscript><section><h2>The barn</h2><p><i></i></p><p>Location one: the barn. At Tŷ Mawr the barn stood across the yard from the house, and it was the ground for parish life. A photograph in the People&#x27;s Collection Wales shows a chapel fete at Great House Farm, with the barn behind the crowd, a slide for the children and a refreshment tent. Testimony holds that Peerless Jim Driscoll, the Cardiff boxing champion, fought one of his early bouts in this barn, and that a Welsh roundhouse was found beneath it. Neither is yet in the evidence catalogue. What the catalogue does hold: Cadw photographed this barn on 29 July 1988, months before it was pulled down, and the ground around it carried a Roman villa and an early Christian cemetery.</p><p>EV-0094 · EV-0055 · EV-0056 · EV-0054 · EV-0206 · EV-0068 · EV-0293</p></section><section><h2>The main house</h2><p><i></i></p><p>Location two: the main house, Tŷ Mawr, the former manorial house of Llandough. In 1824 a survey draws it as Cedfin or Tŷ Mawr Farm, plan 19. In 1881 the census finds John Williams and his household here, and in 1910 he sits on the grand jury of the court leet. In 1958 Mary Doreen Buckler, speaking from this house, calls the loss of the family&#x27;s land since 1667 a Welsh Crichel Down. In April 1974 the Royal Commission measures every room, the drawing this replica is built from, and the house holds an open day to save it. In 1982 and 1983 the land and the house are first registered to others. In December 1988 bulldozers arrive just after four in the morning, while listing is still under consideration. Our reading: the house is the centre of the whole chronology, and it stands again here.</p><p>EV-0004 · EV-0211 · EV-0215 · EV-0224 · EV-0283 · EV-0035 · EV-0037 · EV-0047 · EV-0048 · EV-0049 · EV-0066 · EV-0080 · EV-0086 · EV-0103 · EV-0106 · EV-0118</p></section><section><h2>The church</h2><p><i></i></p><p>Location three: the church. St Dochdwy&#x27;s stood a few steps from the house. The 1994 excavation north of the church recorded more than a thousand early Christian burials, and Cadw listed the church in 1989. The church of the seventeenth century will not be rebuilt in Patagonia, so it appears here as a hologram. No image of that medieval church has been found yet: this hologram is traced from the oldest photograph found, of the church that stood here before 1866.</p><p>EV-0293 · EV-0018 · EV-0272 · EV-0084 · EV-0134</p></section><section><h2>The yard and the stables</h2><p><i></i></p><p>Location four: the yard and the stables, the working heart of the farm. Parish books of the 1870s name John Williams here, and in 1891 a newspaper reports three geese taken from his yard. The family planted trees on the land, the native custom of asserting ownership, and a family photograph records it. From 1916 the estate side drew up papers describing the family&#x27;s occupation on its own terms; the family contest every one of them. Around 1950 the family&#x27;s title papers went missing from the blanket box in the house, and the county court registers open in 1953. Our reading: each paper recast a long occupation as permission.</p><p>EV-0010 · EV-0212 · EV-0009 · EV-0199 · EV-0014 · EV-0023 · EV-0025 · EV-0026 · EV-0030</p></section><section><h2>The gate and the green</h2><p><i></i></p><p>Location five: the entrance gate, looking out to what was parcel C. In 1965 land of the estate went for the Llandough school, and in June 1970 parcel C was registered as village green VG41. After 1988 the site became a housing plan, with a village green planting scheme. In 2026 the record holders were asked directly: the Land Registry, Cadw, the archives. Every answer is a catalogue entry; every gap is a missing record. Our reading: the gate is where the estate went out, parcel by parcel, and where the record now comes back in.</p><p>EV-0042 · EV-0044 · EV-0133 · EV-0135 · EV-0122 · EV-0147 · EV-0161 · EV-0156</p></section></noscript></main>
